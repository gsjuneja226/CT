# CampuShare Test Workflow
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campushare_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://admin:secret@localhost:5432/campushare_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql://admin:secret@localhost:5432/campushare_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-for-ci-only
      RESULTS_DIR: /tmp/campushare_results

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Apply schema to test DB
        run: |
          PGPASSWORD=secret psql -h localhost -U admin -d campushare_test -f backend/schema.sql

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest tests/ -v --tb=short -x

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
